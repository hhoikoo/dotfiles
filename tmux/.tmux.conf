# Terminal type and true colour
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
# Clipboard via OSC 52
set -g set-clipboard on
set -as terminal-features ',xterm-ghostty:clipboard,tmux*:clipboard'
# General behaviour
set -sg escape-time 10
set -g focus-events on
set -s extended-keys on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g allow-rename off
# Copy mode: vi keys, v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Status bar and borders in jellybeans-hc colours
set -g status-style "bg=default,fg=#f8f8f0"
set -g status-right-length 100
set -g status-right "#[fg=#ffc060,bg=#282828,bold] %H:%M #[fg=#909090,nobold]|#[fg=#98b0e0,bold] %y.%m.%d #[default]"
set -g window-status-style none
set -g window-status-format "#[fg=#98b0e0,bg=#282828] #I #[fg=#909090,bg=#282828] #W #[default]"
set -g window-status-current-style none
set -g window-status-current-format "#[fg=#ffc060,bg=#282828] #I #[fg=#f8f8f8,bg=#282828,bold] #W #[default]"
set -g window-status-activity-style "fg=#78a0b8,bg=default"
set -g pane-border-style "fg=#282828"
set -g pane-active-border-style "fg=#98b0e0"
set -g message-style "fg=#98b0e0,bg=#0e0e0e"
set -g mode-style "bg=#303030"
# Pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Reload this file
bind r source-file ~/.tmux.conf
# Per-machine overrides, not in the repo (optional)
source-file -q ~/.config/tmux/local.conf
